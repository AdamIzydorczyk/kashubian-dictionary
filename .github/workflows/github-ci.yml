name: CI/CD

on:
  push:
    branches: [ 'master' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: kashubian-dic
    # Compiling needs a Postgres: flywayMigrate runs before jOOQ code generation,
    # and the generated sources are needed to compile the main and test code.
    # A throwaway schema is used for that - the build never touches the production
    # database.
    services:
      postgres:
        image: postgres:14.5
        env:
          POSTGRES_USER: kas
          POSTGRES_PASSWORD: kas
          POSTGRES_DB: kas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_URL: jdbc:postgresql://localhost:5432/kas
      DB_USER: kas
      DB_PASSWORD: kas
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # plain GitHub-cache based caching, like the old gradle-build-action did
          cache-provider: basic
      - name: Invoke Tests
        run: ./gradlew clean test
      - name: Create Jar
        run: ./gradlew bootJar
      - name: Log in to the Container registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
